<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 1550" width="420" height="1550" style="background:#F4F2F8; font-family:'Cairo', 'Segoe UI', Tahoma, sans-serif;">
  <defs>
    <!-- Gradients -->
    <linearGradient id="mPurpleGradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#23096E"/>
      <stop offset="100%" stop-color="#3A1C8F"/>
    </linearGradient>
    <linearGradient id="mCardTopBar" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#23096E"/>
      <stop offset="50%" stop-color="#3A1C8F"/>
      <stop offset="100%" stop-color="#FF3B30"/>
    </linearGradient>
    
    <!-- Shadow -->
    <filter id="mCardShadow" x="-10%" y="-5%" width="120%" height="115%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="6" stdDeviation="12" flood-color="#23096E" flood-opacity="0.08"/>
    </filter>
  </defs>

  <!-- ==================== 1. MOBILE HEADER ==================== -->
  <g id="mHeader">
    <rect x="0" y="0" width="420" height="70" fill="#FFFFFF" />
    <line x1="0" y1="70" x2="420" y2="70" stroke="#23096E" stroke-opacity="0.08" stroke-width="1"/>
    
    <!-- Brand on Right (RTL) -->
    <g transform="translate(390, 18)">
      <rect x="-35" y="0" width="35" height="35" rx="10" fill="url(#mPurpleGradient)" />
      <text x="-18" y="24" font-size="16" font-weight="900" fill="#FFFFFF" text-anchor="middle">م</text>
      <text x="-45" y="23" font-size="16" font-weight="900" fill="#23096E" text-anchor="end">مساري</text>
      <text x="-95" y="22" font-size="10" font-weight="800" fill="#3A1C8F" text-anchor="end">API</text>
    </g>

    <!-- WhatsApp CTA Button on Left -->
    <g transform="translate(20, 18)">
      <rect x="0" y="0" width="115" height="34" rx="10" fill="url(#mPurpleGradient)" filter="url(#mCardShadow)"/>
      <text x="57" y="22" font-size="11" font-weight="800" fill="#FFFFFF" text-anchor="middle">طلب مفتاح API</text>
    </g>
  </g>

  <!-- ==================== 2. MOBILE HERO ==================== -->
  <g id="mHero" transform="translate(20, 95)">
    <!-- Pill Badge -->
    <g transform="translate(190, 0)">
      <rect x="-115" y="0" width="230" height="30" rx="15" fill="#FFFFFF" stroke="#23096E" stroke-opacity="0.12" filter="url(#mCardShadow)"/>
      <circle cx="95" cy="15" r="3.5" fill="#FF3B30"/>
      <text x="-5" y="20" font-size="11" font-weight="800" fill="#23096E" text-anchor="middle">بوابة المطورين B2B API</text>
    </g>

    <!-- Main Title -->
    <text x="190" y="60" font-size="22" font-weight="900" fill="#0A0912" text-anchor="middle">
      اربط نظامك مع مخزون أكبر شبكة
    </text>
    <text x="190" y="90" font-size="20" font-weight="900" fill="#FF3B30" text-anchor="middle">
      سفر وفنادق في اليمن
    </text>

    <!-- Subtitle -->
    <text x="190" y="125" font-size="12" font-weight="600" fill="#423861" text-anchor="middle">
      واجهة برمجية RESTful سريعة وموثوقة
    </text>
    <text x="190" y="145" font-size="12" font-weight="600" fill="#423861" text-anchor="middle">
      لتأكيد الحجوزات الفندقية لحظياً وبأسعار جملة.
    </text>

    <!-- Hero CTA -->
    <g transform="translate(0, 175)">
      <rect x="0" y="0" width="380" height="46" rx="12" fill="url(#mPurpleGradient)" filter="url(#mCardShadow)"/>
      <text x="190" y="28" font-size="13" font-weight="800" fill="#FFFFFF" text-anchor="middle">
        💬 تواصل لطلب مفتاح الـ API والبدء
      </text>
    </g>

    <!-- 3 Metrics in 1 Row -->
    <g transform="translate(0, 240)">
      <rect x="260" y="0" width="120" height="55" rx="12" fill="#FFFFFF" stroke="#23096E" stroke-opacity="0.08" filter="url(#mCardShadow)"/>
      <text x="320" y="25" font-size="14" font-weight="900" fill="#10B981" text-anchor="middle">&lt; 150ms</text>
      <text x="320" y="42" font-size="10" font-weight="700" fill="#64748B" text-anchor="middle">سرعة الاستجابة</text>

      <rect x="130" y="0" width="120" height="55" rx="12" fill="#FFFFFF" stroke="#23096E" stroke-opacity="0.08" filter="url(#mCardShadow)"/>
      <text x="190" y="25" font-size="14" font-weight="900" fill="#3A1C8F" text-anchor="middle">99.9%</text>
      <text x="190" y="42" font-size="10" font-weight="700" fill="#64748B" text-anchor="middle">ضمان الاستقرار</text>

      <rect x="0" y="0" width="120" height="55" rx="12" fill="#FFFFFF" stroke="#23096E" stroke-opacity="0.08" filter="url(#mCardShadow)"/>
      <text x="60" y="25" font-size="14" font-weight="900" fill="#FF3B30" text-anchor="middle">فوري</text>
      <text x="60" y="42" font-size="10" font-weight="700" fill="#64748B" text-anchor="middle">تأكيد الحجز</text>
    </g>
  </g>

  <!-- ==================== 3. MOBILE API STUDIO WIDGET ==================== -->
  <g id="mStudio" transform="translate(20, 425)">
    <rect x="0" y="0" width="380" height="340" rx="20" fill="#FFFFFF" stroke="#23096E" stroke-opacity="0.1" filter="url(#mCardShadow)"/>
    
    <!-- Top Bar -->
    <rect x="0" y="0" width="380" height="45" rx="20" fill="#F8FAFC"/>
    <circle cx="20" cy="22" r="4" fill="#10B981" />
    <text x="32" y="26" font-size="11" font-weight="800" fill="#64748B">API STUDIO</text>
    
    <rect x="250" y="10" width="115" height="26" rx="8" fill="#23096E"/>
    <text x="307" y="27" font-size="10" font-weight="800" fill="#FFFFFF" text-anchor="middle">🔍 البحث عن الفنادق</text>

    <!-- Method & Endpoint -->
    <g transform="translate(15, 60)">
      <rect x="305" y="0" width="45" height="22" rx="5" fill="#ECFDF5" stroke="#10B981" stroke-opacity="0.4"/>
      <text x="327" y="15" font-size="10" font-weight="900" fill="#065F46" text-anchor="middle">GET</text>
      <text x="295" y="16" font-size="12" font-weight="800" fill="#23096E" text-anchor="end">/v1/hotels/search</text>
      <text x="350" y="40" font-size="12" font-weight="800" fill="#0F172A" text-anchor="end">البحث في مخزون الفنادق اللحظي</text>
    </g>

    <!-- Code Response Box (Clean Light) -->
    <g transform="translate(15, 120)">
      <rect x="0" y="0" width="350" height="200" rx="14" fill="#F8FAFC" stroke="#E2E8F0" />
      <rect x="0" y="0" width="350" height="30" rx="14" fill="#EDE9FE" opacity="0.6"/>
      <text x="15" y="20" font-size="10" font-weight="800" fill="#3A1C8F">Response (200 OK)</text>
      <text x="335" y="20" font-size="10" font-weight="800" fill="#10B981" text-anchor="end">⚡ 84ms</text>

      <g transform="translate(15, 45)" font-family="Consolas, Monaco, monospace" font-size="10">
        <text x="0" y="15" fill="#334155">{</text>
        <text x="10" y="30" fill="#2563EB">"status"</text><text x="55" y="30" fill="#334155">: </text><text x="65" y="30" fill="#16A34A">"success"</text><text x="115" y="30" fill="#334155">,</text>
        <text x="10" y="45" fill="#2563EB">"total"</text><text x="50" y="45" fill="#334155">: </text><text x="60" y="45" fill="#D97706">42</text><text x="75" y="45" fill="#334155">,</text>
        <text x="10" y="60" fill="#2563EB">"hotels"</text><text x="55" y="60" fill="#334155">: [</text>
        <text x="20" y="75" fill="#334155">{</text>
        <text x="30" y="90" fill="#2563EB">"id"</text><text x="50" y="90" fill="#334155">: </text><text x="60" y="90" fill="#16A34A">"htl_sanaa_01"</text><text x="145" y="90" fill="#334155">,</text>
        <text x="30" y="105" fill="#2563EB">"name"</text><text x="65" y="105" fill="#334155">: </text><text x="75" y="105" fill="#16A34A">"فندق جراند صنعاء"</text><text x="180" y="105" fill="#334155">,</text>
        <text x="30" y="120" fill="#2563EB">"priceUSD"</text><text x="85" y="120" fill="#334155">: </text><text x="95" y="120" fill="#D97706">85.00</text><text x="125" y="120" fill="#334155">,</text>
        <text x="30" y="135" fill="#2563EB">"instant"</text><text x="80" y="135" fill="#334155">: </text><text x="90" y="135" fill="#9333EA">true</text>
        <text x="20" y="150" fill="#334155">}</text>
        <text x="0" y="165" fill="#334155">}</text>
      </g>
    </g>
  </g>

  <!-- ==================== 4. 3-STEP QUICKSTART ==================== -->
  <g id="mQuickstart" transform="translate(20, 790)">
    <text x="190" y="0" font-size="18" font-weight="900" fill="#0A0912" text-anchor="middle">
      خطوات البدء السريع (3 خطوات)
    </text>

    <!-- Step 1 -->
    <g transform="translate(0, 20)">
      <rect x="0" y="0" width="380" height="65" rx="14" fill="#FFFFFF" stroke="#23096E" stroke-opacity="0.08" filter="url(#mCardShadow)"/>
      <text x="360" y="40" font-size="22" font-weight="900" fill="#23096E" text-anchor="end">01</text>
      <text x="325" y="30" font-size="13" font-weight="900" fill="#0F172A" text-anchor="end">طلب مفتاح الـ API</text>
      <text x="325" y="48" font-size="11" font-weight="600" fill="#64748B" text-anchor="end">استلم مفتاح Sandbox التجريبي فوراً عبر واتساب.</text>
    </g>

    <!-- Step 2 -->
    <g transform="translate(0, 95)">
      <rect x="0" y="0" width="380" height="65" rx="14" fill="#FFFFFF" stroke="#23096E" stroke-opacity="0.08" filter="url(#mCardShadow)"/>
      <text x="360" y="40" font-size="22" font-weight="900" fill="#3A1C8F" text-anchor="end">02</text>
      <text x="325" y="30" font-size="13" font-weight="900" fill="#0F172A" text-anchor="end">الاختبار في Sandbox</text>
      <text x="325" y="48" font-size="11" font-weight="600" fill="#64748B" text-anchor="end">اختبر البحث وتدفق الحجز مجاناً في بيئة آمنة.</text>
    </g>

    <!-- Step 3 -->
    <g transform="translate(0, 170)">
      <rect x="0" y="0" width="380" height="65" rx="14" fill="#FFFFFF" stroke="#23096E" stroke-opacity="0.08" filter="url(#mCardShadow)"/>
      <text x="360" y="40" font-size="22" font-weight="900" fill="#FF3B30" text-anchor="end">03</text>
      <text x="325" y="30" font-size="13" font-weight="900" fill="#0F172A" text-anchor="end">إطلاق الإنتاج المباشر</text>
      <text x="325" y="48" font-size="11" font-weight="600" fill="#64748B" text-anchor="end">انتقل للـ Live Key وابدأ بتأكيد الحجوزات الرسمية.</text>
    </g>
  </g>

  <!-- ==================== 5. UNIFIED B2B PLAN ==================== -->
  <g id="mPlan" transform="translate(20, 1070)">
    <rect x="0" y="0" width="380" height="420" rx="20" fill="#FFFFFF" stroke="#23096E" stroke-opacity="0.12" filter="url(#mCardShadow)"/>
    <path d="M 0,20 Q 0,0 20,0 L 360,0 Q 380,0 380,20 L 380,6 L 0,6 Z" fill="url(#mCardTopBar)" />

    <!-- Badge & Title -->
    <rect x="180" y="25" width="180" height="24" rx="6" fill="#EDE9FE"/>
    <text x="270" y="41" font-size="10" font-weight="800" fill="#23096E" text-anchor="middle">⚡ خطة الشراكة الموحدة B2B</text>

    <text x="360" y="75" font-size="16" font-weight="900" fill="#0A0912" text-anchor="end">خطة الشراكة والربط البرمجي</text>
    <text x="360" y="98" font-size="13" font-weight="900" fill="#23096E" text-anchor="end">حسب الاستخدام / عمولات مخصصة</text>

    <line x1="20" y1="115" x2="360" y2="115" stroke="#E2E8F0"/>

    <!-- Checklist -->
    <g transform="translate(20, 130)">
      <g transform="translate(0, 15)">
        <circle cx="330" cy="0" r="7" fill="#DCFCE7" />
        <text x="330" y="3" font-size="9" font-weight="900" fill="#16A34A" text-anchor="middle">✓</text>
        <text x="315" y="3" font-size="11" font-weight="800" fill="#1E293B" text-anchor="end">ربط فوري وتأكيد مباشر لجميع الحجوزات</text>
      </g>
      <g transform="translate(0, 42)">
        <circle cx="330" cy="0" r="7" fill="#DCFCE7" />
        <text x="330" y="3" font-size="9" font-weight="900" fill="#16A34A" text-anchor="middle">✓</text>
        <text x="315" y="3" font-size="11" font-weight="800" fill="#1E293B" text-anchor="end">معدل طلبات غير محدود بوقت استجابة &lt; 150ms</text>
      </g>
      <g transform="translate(0, 69)">
        <circle cx="330" cy="0" r="7" fill="#DCFCE7" />
        <text x="330" y="3" font-size="9" font-weight="900" fill="#16A34A" text-anchor="middle">✓</text>
        <text x="315" y="3" font-size="11" font-weight="800" fill="#1E293B" text-anchor="end">بيئة تجريبية Sandbox كاملة مجاناً</text>
      </g>
      <g transform="translate(0, 96)">
        <circle cx="330" cy="0" r="7" fill="#DCFCE7" />
        <text x="330" y="3" font-size="9" font-weight="900" fill="#16A34A" text-anchor="middle">✓</text>
        <text x="315" y="3" font-size="11" font-weight="800" fill="#1E293B" text-anchor="end">تحديث لحظي لأسعار الغرف بالريال والدولار</text>
      </g>
      <g transform="translate(0, 123)">
        <circle cx="330" cy="0" r="7" fill="#DCFCE7" />
        <text x="330" y="3" font-size="9" font-weight="900" fill="#16A34A" text-anchor="middle">✓</text>
        <text x="315" y="3" font-size="11" font-weight="800" fill="#1E293B" text-anchor="end">نظام Webhooks للإشعارات اللحظية</text>
      </g>
      <g transform="translate(0, 150)">
        <circle cx="330" cy="0" r="7" fill="#DCFCE7" />
        <text x="330" y="3" font-size="9" font-weight="900" fill="#16A34A" text-anchor="middle">✓</text>
        <text x="315" y="3" font-size="11" font-weight="800" fill="#1E293B" text-anchor="end">دعم فني وهندسي مخصص 24/7 عبر واتساب</text>
      </g>
      <g transform="translate(0, 177)">
        <circle cx="330" cy="0" r="7" fill="#DCFCE7" />
        <text x="330" y="3" font-size="9" font-weight="900" fill="#16A34A" text-anchor="middle">✓</text>
        <text x="315" y="3" font-size="11" font-weight="800" fill="#1E293B" text-anchor="end">عقد مستوى الخدمة المضمون (SLA 99.9%)</text>
      </g>
    </g>

    <!-- Bottom WhatsApp Action Button -->
    <g transform="translate(20, 345)">
      <rect x="0" y="0" width="340" height="48" rx="14" fill="url(#mPurpleGradient)" filter="url(#mCardShadow)"/>
      <text x="170" y="29" font-size="13" font-weight="800" fill="#FFFFFF" text-anchor="middle">
        💬 تواصل معنا لطلب مفتاح الـ API
      </text>
    </g>
  </g>

</svg>
