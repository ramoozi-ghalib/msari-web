<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#23096E" />
  <meta name="robots" content="noindex, nofollow" />
  <title>مساري — غير متصل بالإنترنت | Msari — Offline</title>
  <style>
    :root {
      --brand-primary: #23096E;
      --brand-secondary: #3A1C8F;
      --surface-bg: #F4F2F8;
      --accent-alert: #FF3B30;
      --text-main: #181036;
      --text-muted: #5C5574;
      --card-bg: #FFFFFF;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html,
    body {
      min-height: 100%;
      background-color: var(--surface-bg);
      color: var(--text-main);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "SF Pro Arabic", Tahoma, Arial, sans-serif;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
    }

    body {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100dvh;
      padding:
        calc(24px + env(safe-area-inset-top, 0px))
        calc(20px + env(safe-area-inset-right, 0px))
        calc(24px + env(safe-area-inset-bottom, 0px))
        calc(20px + env(safe-area-inset-left, 0px));
      background:
        radial-gradient(circle at top right, rgba(58, 28, 143, 0.12), transparent 48%),
        radial-gradient(circle at bottom left, rgba(35, 9, 110, 0.10), transparent 46%),
        var(--surface-bg);
    }

    .card {
      width: 100%;
      max-width: 440px;
      background: var(--card-bg);
      border-radius: 24px;
      padding: 36px 28px 32px;
      text-align: center;
      box-shadow:
        0 18px 44px rgba(35, 9, 110, 0.10),
        0 2px 8px rgba(35, 9, 110, 0.05);
      border: 1px solid rgba(35, 9, 110, 0.08);
    }

    .brand-pill {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 6px 14px;
      border-radius: 999px;
      background: rgba(35, 9, 110, 0.07);
      color: var(--brand-primary);
      font-size: 13px;
      font-weight: 700;
      letter-spacing: 0.01em;
      margin-bottom: 24px;
    }

    .status-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: var(--accent-alert);
      box-shadow: 0 0 0 4px rgba(255, 59, 48, 0.18);
    }

    .illustration {
      width: 112px;
      height: 112px;
      margin: 0 auto 22px;
      display: flex;
      align-items: center;
      justify-content: center;
      border-radius: 28px;
      background: linear-gradient(145deg, rgba(35, 9, 110, 0.08), rgba(58, 28, 143, 0.14));
    }

    h1 {
      font-size: 22px;
      font-weight: 800;
      line-height: 1.4;
      color: var(--brand-primary);
      margin-bottom: 6px;
    }

    .subtitle-en {
      font-size: 15px;
      font-weight: 600;
      color: var(--brand-secondary);
      direction: ltr;
      margin-bottom: 18px;
    }

    .note {
      font-size: 14px;
      line-height: 1.75;
      color: var(--text-muted);
      margin-bottom: 8px;
    }

    .note-en {
      font-size: 13px;
      line-height: 1.6;
      color: var(--text-muted);
      opacity: 0.9;
      direction: ltr;
      margin-bottom: 28px;
    }

    .retry-btn {
      width: 100%;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      padding: 15px 22px;
      border: none;
      border-radius: 14px;
      background: linear-gradient(135deg, var(--brand-primary), var(--brand-secondary));
      color: #FFFFFF;
      font-family: inherit;
      font-size: 16px;
      font-weight: 700;
      cursor: pointer;
      box-shadow: 0 10px 24px rgba(35, 9, 110, 0.24);
      transition: transform 0.15s ease, box-shadow 0.15s ease, opacity 0.15s ease;
      -webkit-tap-highlight-color: transparent;
    }

    .retry-btn:hover {
      box-shadow: 0 12px 28px rgba(35, 9, 110, 0.30);
    }

    .retry-btn:active {
      transform: scale(0.985);
      opacity: 0.94;
    }

    .retry-btn:focus-visible {
      outline: 3px solid rgba(58, 28, 143, 0.45);
      outline-offset: 2px;
    }

    .reconnecting {
      margin-top: 16px;
      min-height: 20px;
      font-size: 13px;
      font-weight: 600;
      color: var(--brand-secondary);
    }
  </style>
</head>
<body>
  <main class="card" role="main">
    <div class="brand-pill" aria-label="Msari status">
      <span class="status-dot" aria-hidden="true"></span>
      <span>مساري • Msari</span>
    </div>

    <div class="illustration" aria-hidden="true">
      <svg width="64" height="64" viewBox="0 0 64 64" fill="none" xmlns="http://www.w3.org/2000/svg">
        <path d="M12 24.5C17.8 19.6 24.7 17 32 17C39.3 17 46.2 19.6 52 24.5" stroke="#23096E" stroke-width="4" stroke-linecap="round" stroke-opacity="0.28" />
        <path d="M19 32.5C22.8 29.3 27.3 27.6 32 27.6C36.7 27.6 41.2 29.3 45 32.5" stroke="#3A1C8F" stroke-width="4" stroke-linecap="round" stroke-opacity="0.45" />
        <path d="M26 40.2C27.8 38.8 29.9 38 32 38C34.1 38 36.2 38.8 38 40.2" stroke="#23096E" stroke-width="4" stroke-linecap="round" />
        <circle cx="32" cy="48" r="3.5" fill="#23096E" />
        <path d="M16 14L48 50" stroke="#FF3B30" stroke-width="4.2" stroke-linecap="round" />
      </svg>
    </div>

    <h1>أنت غير متصل بالإنترنت حالياً</h1>
    <p class="subtitle-en">You are currently offline</p>

    <p class="note">
      لا تقلق — سيعاود مساري الاتصال تلقائياً فور عودة الإنترنت إلى جهازك.
    </p>
    <p class="note-en">
      Msari will reconnect automatically as soon as your internet connection returns.
    </p>

    <button id="retry-btn" class="retry-btn" type="button" onclick="window.location.reload()">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" aria-hidden="true">
        <path d="M21 12A9 9 0 1 1 18.36 5.64M21 3V9H15" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" />
      </svg>
      <span>إعادة المحاولة / Try Again</span>
    </button>

    <p id="status-msg" class="reconnecting" aria-live="polite"></p>
  </main>

  <script>
    (function () {
      var statusEl = document.getElementById('status-msg');
      window.addEventListener('online', function () {
        if (statusEl) {
          statusEl.textContent = 'عاد الاتصال بالإنترنت — جارٍ إعادة التحميل...';
        }
        window.location.reload();
      });
    })();
  </script>
</body>
</html>
